[package]
name = "database"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
