[package]
name = "shared"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = "0.4.45"
tsid = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
